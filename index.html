<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Favorite Pokémon Head-to-Head</title>
  <meta name="description" content="Pick your favorite Pokémon, two at a time. Coming soon.">
  <style>
    :root {
      --bg: #f7f7f9;
      --fg: #1d1d22;
      --muted: #5c5c66;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16161a;
        --fg: #ececf1;
        --muted: #a0a0ab;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: clamp(1.75rem, 5vw, 2.75rem); }
    p { margin: 0; color: var(--muted); font-size: 1.125rem; }
  </style>
</head>
<body>
  <main>
    <h1>Favorite Pokémon Head-to-Head</h1>
    <p>Two Pokémon. Pick your favorite. Repeat.</p>
    <p><strong>Coming soon.</strong></p>
  </main>
</body>
</html>
